<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Student Project{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", sans-serif;
            color: #182d35;
            background: #f3f7f5;
        }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; }
        header {
            background: #123b3b;
            color: #fff;
            padding: 18px max(24px, calc((100% - 960px) / 2));
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }
        header a { color: #fff; text-decoration: none; }
        .brand { font-weight: 700; }
        nav { display: flex; gap: 20px; }
        main { max-width: 960px; margin: 0 auto; padding: 64px 24px; }
        h1 { font-size: clamp(2rem, 5vw, 3.5rem); line-height: 1.08; margin: 0 0 16px; }
        p { color: #52666b; line-height: 1.6; }
        .eyebrow { color: #16736a; font-size: .8rem; font-weight: 700; text-transform: uppercase; }
        .action {
            display: inline-block;
            margin-top: 18px;
            padding: 12px 18px;
            border-radius: 4px;
            background: #d95038;
            color: white;
            text-decoration: none;
            font-weight: 700;
        }
        .status { border-left: 4px solid #d95038; padding: 12px 16px; background: #fff; }
        @media (max-width: 520px) {
            header { align-items: flex-start; flex-direction: column; }
            nav { gap: 16px; }
            main { padding-top: 44px; }
        }
    </style>
</head>
<body>
    <header>
        <a class="brand" href="/">Student Project</a>
        <nav aria-label="Main navigation">
            <a href="/">Home</a>
            <a href="/student/">Students</a>
        </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
</body>
</html>
